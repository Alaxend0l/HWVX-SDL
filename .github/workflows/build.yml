# Builds every platform's package (see packaging/README.md):
# - on each push and pull request: as workflow artifacts (Actions tab);
# - on a version tag (v0.1, v1.2.3...): also as a GitHub Release.
# Each job runs the same script you can run locally in packaging/.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Shown in the packages and their names: the tag for releases (v1.2 ->
  # 1.2), else dev-<commit>. Set per job by the "Version" step.
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  windows:
    name: Windows x86_64 (.exe)
    runs-on: ubuntu-24.04   # cross-compiled with MinGW-w64 GCC
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [ -n "$TAG" ]; then v=${TAG#v}; else v=dev-${GITHUB_SHA::7}; fi
          echo "HWVX_VERSION=$v" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64 cmake ninja-build
      - uses: actions/cache@v4
        with:
          path: build-pkg/windows/sdl-prefix
          key: sdl-windows-${{ hashFiles('packaging/SDL_VERSION', 'packaging/build-sdl3.sh', 'cmake/mingw-w64-x86_64.cmake') }}
      - run: packaging/windows/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  macos:
    name: macOS universal (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [ -n "$TAG" ]; then v=${TAG#v}; else v=dev-${GITHUB_SHA::7}; fi
          echo "HWVX_VERSION=$v" >> "$GITHUB_ENV"
      - run: brew install ninja librsvg
      - uses: actions/cache@v4
        with:
          path: build-pkg/macos/sdl-prefix
          key: sdl-macos-${{ hashFiles('packaging/SDL_VERSION', 'packaging/build-sdl3.sh') }}
      - run: packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*

  linux:
    name: Linux ${{ matrix.arch }} (AppImage, bare program)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04       # old glibc: runs on more distributions
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [ -n "$TAG" ]; then v=${TAG#v}; else v=dev-${GITHUB_SHA::7}; fi
          echo "HWVX_VERSION=$v" >> "$GITHUB_ENV"
      - name: SDL's build dependencies (it loads them at run time when present)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl file \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libusb-1.0-0-dev \
            libwayland-dev wayland-protocols libdecor-0-dev
      - uses: actions/cache@v4
        with:
          path: build-pkg/linux-${{ matrix.arch }}/sdl-prefix
          key: sdl-linux-${{ matrix.arch }}-${{ hashFiles('packaging/SDL_VERSION', 'packaging/build-sdl3.sh') }}
      - run: packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [ -n "$TAG" ]; then v=${TAG#v}; else v=dev-${GITHUB_SHA::7}; fi
          echo "HWVX_VERSION=$v" >> "$GITHUB_ENV"
      - name: Bundle name
        run: echo "BUNDLE=HWVX-$HWVX_VERSION-${{ matrix.arch }}.flatpak" >> "$GITHUB_ENV"
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ env.BUNDLE }}
          manifest-path: packaging/flatpak/io.github.alaxend0l.hwvx.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('packaging/flatpak/*.yml') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: ${{ env.BUNDLE }}

  android:
    name: Android (.apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: bash
        run: |
          if [ -n "$TAG" ]; then v=${TAG#v}; else v=dev-${GITHUB_SHA::7}; fi
          echo "HWVX_VERSION=$v" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key (optional; without it the APK is signed with a debug key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HWVX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          HWVX_VERSION_CODE: ${{ github.run_number }}
          HWVX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HWVX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HWVX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/HWVX-$HWVX_VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux, flatpak, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
