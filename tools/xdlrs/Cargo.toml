[package]
name = "xdlrs"
version = "0.1.0"
edition = "2024"
description = "The .xdl tools' core (tools/xdl_struct.py, tools/xdl_tac.py) as a library for the editor"

[dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
regex = "1.11"
indexmap = "2"
blake2 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
jsonschema = { version = "0.33", default-features = false }
