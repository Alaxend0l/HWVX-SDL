[package]
name = "hwvx-browser"
version = "0.2.2"
edition = "2024"

[dependencies]
eframe = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
png = "0.18"
libloading = "0.8"
zune-jpeg = "0.5"
xdlrs = { path = "../xdlrs" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Console", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# xdlrs::disc::test_images: the extraction's tests on tiny disc images
xdlrs = { path = "../xdlrs", features = ["test-utils"] }
