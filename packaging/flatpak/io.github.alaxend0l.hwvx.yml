# Flatpak of the game, for x86_64 and aarch64 (packaging/flatpak/build.sh,
# or the flatpak jobs in .github/workflows/build.yml). SDL3 is built here
# from the release in packaging/SDL_VERSION (keep url and sha256 in step);
# the game from this checkout. The game data is picked with the folder
# dialog (xdg-desktop-portal), so no file system access is granted.
id: io.github.alaxend0l.hwvx
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: hwvx
# flatpak-builder checks and composes icons with the build host's image
# loaders, and in the CI container those don't read SVG (icon-file-read-error,
# "not a valid icon"): the Flatpak ships the PNG icon only (cleanup below).
# The composed AppStream catalogue is skipped too; a bundle doesn't need it,
# and the desktop file, icon and metainfo are still exported. (Flathub
# composes on its own.)
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all          # GPU and game controllers
modules:
  - name: SDL3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib   # CMake picks lib64 here, which /app's loader path lacks
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
        sha256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share

  - name: hwvx
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DHWVX_DEFAULT_RENDERER=vulkan   # falls back to OpenGL without Vulkan
    cleanup:
      - /share/icons/hicolor/scalable   # PNG only (see appstream-compose above)
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - build-gcc
          - build-ubsan
          - build-pkg
          - dist
          - orig
          - pc-orig
          - HWVX-GC-Decomp
          - android
