# Flatpak of the game, for x86_64 and aarch64 (packaging/flatpak/build.sh,
# or the flatpak jobs in .github/workflows/build.yml). SDL3 is built here
# from the release in packaging/SDL_VERSION (keep url and sha256 in step);
# the game from this checkout; cloudflared is the release in
# packaging/CLOUDFLARED_VERSION (likewise). The game data is picked with the folder
# dialog (xdg-desktop-portal), so no file system access is granted.
id: io.github.alaxend0l.hwvx
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: hwvx
# flatpak-builder checks and composes icons with the build host's image
# loaders, and in the CI container those don't read SVG (icon-file-read-error,
# "not a valid icon"): the Flatpak ships the PNG icon only (cleanup below).
# The composed AppStream catalogue is skipped too; a bundle doesn't need it,
# and the desktop file, icon and metainfo are still exported. (Flathub
# composes on its own.)
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all          # GPU and game controllers
  - --share=network       # online play
modules:
  - name: SDL3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib   # CMake picks lib64 here, which /app's loader path lacks
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
        sha256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share

  # Next to the game, where src/port/tunnel.c looks first: the sandbox can't see
  # one installed on the system.
  - name: cloudflared
    buildsystem: simple
    build-options:
      no-debuginfo: true   # a Go program, kept as released
    build-commands:
      - install -Dm755 cloudflared /app/bin/cloudflared
      - install -Dm644 cloudflared-LICENSE /app/share/licenses/cloudflared/LICENSE
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-amd64
        sha256: 1f99fb518b83dec2ba8d870a7cc991d82a77e6196295a3d2754ba17ab9f91872
        dest-filename: cloudflared
      - type: file
        only-arches: [aarch64]
        url: https://github.com/cloudflare/cloudflared/releases/download/2026.10.7/cloudflared-linux-arm64
        sha256: 3df43aedc9ff291d1735b5cb576cb97e0b157488796db2e32b28aecabb445775
        dest-filename: cloudflared
      - type: file
        path: ../cloudflared-LICENSE

  - name: hwvx
    buildsystem: cmake-ninja
    config-opts:
      - -DFETCHCONTENT_SOURCE_DIR_MBEDTLS=/run/build/hwvx/mbedtls   # no network while building (CMakeLists.txt)
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo   # renderer: vulkan, OpenGL without it (main_sdl.c)
    cleanup:
      - /share/icons/hicolor/scalable   # PNG only (see appstream-compose above)
    sources:
      - type: archive
        url: https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2
        sha256: a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
        dest: mbedtls
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - build-gcc
          - build-ubsan
          - build-pkg
          - dist
          - orig
          - pc-orig
          - HWVX-GC-Decomp
          - HWVX-X-FILE-EDITOR
          - android
