# Flatpak of the game, for x86_64 and aarch64 (packaging/flatpak/build.sh,
# or the flatpak jobs in .github/workflows/build.yml). SDL3 is built here
# from the release in packaging/SDL_VERSION (keep url and sha256 in step);
# the game from this checkout. The game data is picked with the folder
# dialog (xdg-desktop-portal), so no file system access is granted.
# Movies: the game loads FFmpeg at run time (src/port/bink.c). The ffmpeg
# module below is the packages' own LGPL build (packaging/ffmpeg/build.sh,
# its tarball and signature as sources; keep them in step with
# packaging/ffmpeg/FFMPEG_*), in /app/lib, and HWVX_FFMPEG_DIR makes that the
# only place the game looks: the runtime's org.freedesktop.Platform.codecs-extra
# extension, which is on the library path when installed, is built with
# --enable-gpl (packaging/README.md, "FFmpeg").
id: io.github.alaxend0l.hwvx
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: hwvx
# flatpak-builder checks and composes icons with the build host's image
# loaders, and in the CI container those don't read SVG (icon-file-read-error,
# "not a valid icon"): the Flatpak ships the PNG icon only (cleanup below).
# The composed AppStream catalogue is skipped too; a bundle doesn't need it,
# and the desktop file, icon and metainfo are still exported. (Flathub
# composes on its own.)
appstream-compose: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all          # GPU and game controllers
  - --share=network       # online play
  - --env=HWVX_FFMPEG_DIR=/app/lib   # the ffmpeg module's, never the runtime's (above)
modules:
  - name: SDL3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib   # CMake picks lib64 here, which /app's loader path lacks
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_TESTS=OFF
      - -DSDL_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
        sha256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share

  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - ./build.sh linux work prefix
      - install -Dm644 -t /app/lib prefix/lib/*
      - mkdir -p /app/share/licenses/io.github.alaxend0l.hwvx
      - cp -R prefix/licenses/FFmpeg /app/share/licenses/io.github.alaxend0l.hwvx/
    sources:
      - type: dir
        path: ../ffmpeg
      - type: file
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e
        dest: work
      - type: file
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz.asc
        sha256: d617fd94ea354dadd2a8bb16243d37c44e1e9729b06b6ad58fe30bfb0fa943f2
        dest: work

  - name: hwvx
    buildsystem: cmake-ninja
    config-opts:
      - -DFETCHCONTENT_SOURCE_DIR_MBEDTLS=/run/build/hwvx/mbedtls   # no network while building (CMakeLists.txt)
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo   # renderer: vulkan, OpenGL without it (main_sdl.c)
    cleanup:
      - /share/icons/hicolor/scalable   # PNG only (see appstream-compose above)
    sources:
      - type: archive
        url: https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-3.6.7/mbedtls-3.6.7.tar.bz2
        sha256: a7e8bcbec0e6f761b4af24f25677626b35f762f68eef79c08677a363212d11f6
        dest: mbedtls
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - build-gcc
          - build-ubsan
          - build-pkg
          - dist
          - orig
          - pc-orig
          - HWVX-GC-Decomp
          - HWVX-X-FILE-EDITOR
          - android
