<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon (placeholder): a wheel with a flame streak. Linux packages use
     it as is; packaging/make-icons.sh renders the macOS .icns from it. The
     Android launcher icon (android/app/src/main/res) is the same design. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="1" stop-color="#0a1033"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd400" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#e3180b"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <path d="M40 300 C150 250 230 190 360 170 L360 330 C240 330 150 340 40 300 Z" fill="url(#flame)"/>
  <g transform="translate(330 256)">
    <circle r="130" fill="#111"/>
    <circle r="112" fill="#2a2a2a"/>
    <circle r="78" fill="#c9ccd3"/>
    <g fill="#7d828c">
      <rect x="-9" y="-74" width="18" height="60" rx="6"/>
      <rect x="-9" y="-74" width="18" height="60" rx="6" transform="rotate(72)"/>
      <rect x="-9" y="-74" width="18" height="60" rx="6" transform="rotate(144)"/>
      <rect x="-9" y="-74" width="18" height="60" rx="6" transform="rotate(216)"/>
      <rect x="-9" y="-74" width="18" height="60" rx="6" transform="rotate(288)"/>
    </g>
    <circle r="22" fill="#e3180b"/>
  </g>
</svg>
